# ===================== Bluetooth Configuration =====================
# Maximum connection interval (1.25ms unit, 9=11.25ms)
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
# Connection latency (number of connection events the host skips)
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
# ACL data packet send buffer count
CONFIG_BT_BUF_ACL_TX_COUNT=32
# L2CAP layer send buffer count
CONFIG_BT_L2CAP_TX_BUF_COUNT=32
# Bluetooth transmit power +8dBm (maximum)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Enable Bluetooth battery service 
CONFIG_BT_BAS=y

# ===================== Auto-Sleep Related =====================
# Auto-sleep
CONFIG_ZMK_SLEEP=y
# (Already commented) Time to enter auto-sleep (unit: ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
# Time to enter idle state (unit: ms)
CONFIG_ZMK_IDLE_TIMEOUT=15000

# ===================== BLE Experimental Features =====================
# Enable BLE experimental connection features
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Central side fetches peripheral battery level
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Central side proxies battery level
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# Behavior queue size, improves macro/combo key responsiveness
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# ===================== Display Related =====================
# Enable display support
CONFIG_ZMK_DISPLAY=y
# Turn off screen when keyboard is idle
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# ===================== SPI and Input Devices =====================
# Enable SPI bus support
CONFIG_SPI=y
# Enable input device support
CONFIG_INPUT=y
# Enable external power detection
CONFIG_ZMK_EXT_POWER=y

# ===================== Power Control Related =====================
# Do not modify the following parameters, they are used for powering certain keyboard peripherals, not related to RGB backlighting
CONFIG_ZMK_BACKLIGHT=y
# Backlight brightness is 100 on startup
CONFIG_ZMK_BACKLIGHT_BRT_START=100
# Automatically enable backlight on startup
CONFIG_ZMK_BACKLIGHT_ON_START=y
# Automatically turn off backlight when idle
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n



# ===================== Pin Control =====================
# Enable pin control
CONFIG_PINCTRL=y

# ===================== Pointing Device (Mouse) Related =====================
# Enable pointing device support
CONFIG_ZMK_POINTING=y
# Enable smooth scrolling
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# ===================== USB Logging =====================
# Enable USB log output
CONFIG_ZMK_USB_LOGGING=y

# ===================== RGB LED Strip Related =====================
# Enable WS2812 LED strip support
CONFIG_WS2812_STRIP=y
# Enable RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
# Automatically enable RGB underglow on startup
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
# Automatically turn off RGB underglow when idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# RGB underglow initial hue (green range)
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
# RGB underglow initial effect (effect #3)
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
# RGB switch can also control output power
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y

# ========== Other Optional Settings (uncomment if needed) ==========
# Automatically turn off RGB lights when USB is disconnected
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
# Debounce time, can be extended if double-clicks occur
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=4
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=2

# Enable 32kHz crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y




CONFIG_GPIO=y
